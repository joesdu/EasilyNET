name: Release
permissions:
  contents: read
  pull-requests: write
  # NuGet Trusted Publishing(OIDC) 需要请求 GitHub 身份令牌
  id-token: write

on:
  push:
    tags:
      - "*.*.*"
env:
  # Linux
  TZ: Asia/Chongqing
  # Windows
  #TZ: "China Standard Time"
  #SOLUTION: EasilyNET.slnx
  ARTIFACTS: ./artifacts
jobs:
  build:
    #runs-on: windows-latest
    #defaults:
    #  run:
    #    shell: pwsh
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 该名称必须与 nuget.org 上 Trusted Publishing 策略中的 Environment 一致
    environment:
      name: Release
    steps:
      # Windows Only
      #- name: Set Timezone
      #  run: |
      #    tzutil /s "$env:TZ"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get the latest tag for push events
        if: github.event_name == 'push'
        id: get_tag_push
        run: echo "EASILYNET_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # Ubuntu
      - name: Get the latest tag for pull request events
        if: github.event_name == 'pull_request'
        id: get_tag_pr
        run: |
          TAG=$(git describe --tags --abbrev=0)
          echo "EASILYNET_VERSION=$TAG" >> $GITHUB_ENV

      # Windows
      #- name: Get the latest tag for pull request events
      #  if: github.event_name == 'pull_request'
      #  id: get_tag_pr
      #  run: |
      #    $TAG = (git describe --tags --abbrev=0)
      #    echo "EASILYNET_VERSION=$TAG" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      #    $EASILYNET_VERSION = $TAG

      # Linux
      - name: Display the latest tag
        run: echo $EASILYNET_VERSION

      # Windows
      #- name: Display the latest tag
      #  run: Write-Host $EASILYNET_VERSION

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-quality: preview
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Pack NuGet Package
        run: ./Pack.ps1
        shell: pwsh

      # 通过 OIDC 换取 nuget.org 的短期 API Key(有效期 1 小时),不再使用长期密钥
      # user 为 nuget.org 的用户名(profile name),非邮箱
      - name: NuGet Login (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: joes_du

      - name: Push to NuGet
        env:
          NUGET_URL: https://api.nuget.org/v3/index.json
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: ./Push.ps1
        shell: pwsh
